services:
  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - LNI_SERVER_PORT=8080
      - LNI_MONGODB_URI=mongodb://mongodb:27017
      - LNI_MONGODB_DATABASE=letsnormalizeit
      - LNI_AUTH_TYPE=jwt
      - LNI_JWT_SECRET=${LNI_JWT_SECRET}
      - LNI_JWT_EXPIRY=24h
      - LNI_CACHE_ENABLED=false
      - LNI_LOGGER_LEVEL=info
      - LNI_LOGGER_ENCODING=json
    networks:
      - lni-network
    restart: always

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lni-network
    restart: always

volumes:
  mongodb_data:

networks:
  lni-network:
    driver: bridge
